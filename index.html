<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日作业</title>
<style>
:root { --bg:#f4f6fa; --card:#fff; --text:#243047; --muted:#778196; --line:#e8ebf1; --blue:#4263eb; --green:#21865b; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 "Microsoft YaHei","PingFang SC",Arial,sans-serif; }
button, input, select { font: inherit; }
button { cursor: pointer; }
.app { max-width: 1000px; margin: auto; padding: 16px 14px 24px; }
header { background: linear-gradient(130deg,#263c68,#4263a9); color:#fff; border-radius:16px; padding:14px 20px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
h1 { margin:0; font-size:21px; }
.datebar { display:flex; gap:8px; align-items:center; }
.datebar .wk { opacity:.85; font-size:13px; }
input, select { padding:7px 9px; border:1px solid #dfe4ed; border-radius:8px; color:var(--text); background:#fff; min-width:0; }
input:focus, select:focus { outline:2px solid #dbe4ff; border-color:#8ca4ff; }
.btn { border:1px solid #dfe4ed; border-radius:8px; background:#fff; color:#35425b; padding:7px 12px; }
.btn.primary { background:var(--blue); color:#fff; border-color:var(--blue); }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
.stats { display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
.stat b { font-size:20px; margin-right:2px; }
.stat span { color:var(--muted); font-size:12px; }
.progress { flex:1; min-width:120px; height:8px; background:#edf0f5; border-radius:8px; overflow:hidden; }
.progress div { height:100%; width:0; background:var(--green); transition:width .2s; }
.add { display:flex; gap:8px; }
.add input { flex:1; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:12px; align-items:start; }
.subject { background:var(--card); border:1px solid var(--line); border-top:3px solid var(--c); border-radius:12px; padding:10px 14px 6px; }
.subject h2 { margin:0 0 4px; font-size:15px; color:var(--c); display:flex; justify-content:space-between; }
.subject h2 small { color:var(--muted); font-weight:400; font-size:12px; }
.task { display:flex; align-items:center; gap:8px; padding:7px 0; border-top:1px solid var(--line); }
.task input[type=checkbox] { width:18px; height:18px; flex:none; }
.task .t { flex:1; overflow-wrap:anywhere; }
.task.done .t { color:#9aa3b2; text-decoration:line-through; }
.task .min { width:54px; padding:4px 6px; text-align:center; }
.task .u { color:var(--muted); font-size:12px; }
.del { border:0; background:none; color:#b0b8c6; font-size:16px; padding:0 2px; }
.del:hover { color:#b94343; }
.foot { display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:14px; color:var(--muted); font-size:12px; }
.foot .btn { padding:4px 10px; font-size:12px; }
.empty { text-align:center; color:var(--muted); padding:30px 0; background:#fafbfe; border:1px dashed #dce2ed; border-radius:12px; }
</style>
</head>
<body>
<div class="app">

<header>
  <h1>每日作业</h1>
  <div class="datebar">
    <input type="date" id="dailyDate">
    <span class="wk" id="weekday"></span>
    <button class="btn" id="todayBtn">今天</button>
  </div>
</header>

<div class="card stats" id="stats"></div>

<form class="card add" id="form">
  <select id="subject"></select>
  <input id="title" maxlength="300" placeholder="作业内容，例如：数学学案 P20-P22" required>
  <button class="btn primary" type="submit">＋ 登记</button>
</form>

<div class="grid" id="list"></div>

<div class="foot">
  <span id="saveStatus">数据自动保存在当前浏览器</span>
  <button class="btn" id="exportBtn">备份数据</button>
  <button class="btn" id="importBtn">恢复备份</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</div>

</div>

<script>
const KEY = "dailyHomeworkPlanner_v1";
const SUBJECTS = ["语文","数学","英语","历史","地理","生物","道德与法治"];
const COLORS = {"语文":"#c05c50","数学":"#4263eb","英语":"#21865b","历史":"#9a68bb","地理":"#b17b32","生物":"#299b91","道德与法治":"#63738c"};
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);

function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

let tasks = [], reflections = {};
try {
  const s = JSON.parse(localStorage.getItem(KEY) || "{}");
  tasks = Array.isArray(s.tasks) ? s.tasks : [];
  reflections = s.reflections || {};   // 旧数据原样保留
} catch (e) {}
const save = () => {
  try {
    localStorage.setItem(KEY, JSON.stringify({version:1, tasks, reflections}));
    $("saveStatus").textContent = "✓ 已自动保存到当前浏览器";
  } catch (e) {
    $("saveStatus").textContent = "保存失败：请先备份数据，并检查浏览器存储空间";
  }
};

$("subject").innerHTML = SUBJECTS.map(s => `<option>${s}</option>`).join("");
$("dailyDate").value = today();

const dayTasks = () => tasks.filter(t => t.date === $("dailyDate").value)
  .sort((a,b) => (a.order ?? 0) - (b.order ?? 0));
const subjOf = t => SUBJECTS.includes(t.subject) ? t.subject : "语文";

function fmt(min) {
  return min >= 60 ? Math.floor(min/60) + "<span> 小时 </span>" + (min%60) + "<span> 分</span>" : min + "<span> 分钟</span>";
}

function renderStats() {
  const list = dayTasks();
  const done = list.filter(t => t.done).length;
  const used = list.reduce((s,t) => s + (Number(t.actualMinutes) || 0), 0);
  const pct = list.length ? Math.round(done / list.length * 100) : 0;
  $("stats").innerHTML = `
    <div class="stat"><b>${list.length}</b><span>项作业</span></div>
    <div class="stat"><b>${done}</b><span>/ ${list.length} 已完成</span></div>
    <div class="stat"><b>${fmt(used)}</b><span>实际用时</span></div>
    <div class="progress"><div style="width:${pct}%"></div></div>`;
}

function renderList() {
  const list = dayTasks();
  if (!list.length) {
    $("list").innerHTML = `<div class="empty" style="grid-column:1/-1">今天还没有登记作业</div>`;
    return;
  }
  $("list").innerHTML = SUBJECTS.map(sub => {
    const items = list.filter(t => subjOf(t) === sub);
    if (!items.length) return "";
    const done = items.filter(t => t.done).length;
    return `<section class="subject" style="--c:${COLORS[sub]}">
      <h2>${sub}<small>${done}/${items.length}</small></h2>
      ${items.map(t => `
      <div class="task ${t.done ? "done" : ""}">
        <input type="checkbox" data-done="${esc(t.id)}" ${t.done ? "checked" : ""}>
        <span class="t">${esc(t.title)}</span>
        <input class="min" type="number" min="0" max="1440" placeholder="用时" data-min="${esc(t.id)}" value="${t.actualMinutes ?? ""}">
        <span class="u">分</span>
        <button class="del" data-del="${esc(t.id)}" title="删除">×</button>
      </div>`).join("")}
    </section>`;
  }).join("");
}

function render() {
  const d = new Date($("dailyDate").value + "T00:00");
  $("weekday").textContent = isNaN(d) ? "" : d.toLocaleDateString("zh-CN", {weekday:"long"});
  renderStats();
  renderList();
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const title = $("title").value.trim();
  if (!title) return;
  tasks.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    date: $("dailyDate").value, subject: $("subject").value, title,
    actualMinutes: null, done: false, order: Date.now(), createdAt: Date.now()
  });
  save();
  $("title").value = "";
  render();
  $("title").focus();
});

$("list").addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.done) {
    const t = tasks.find(x => x.id === el.dataset.done);
    if (t) { t.done = el.checked; save(); render(); }
  } else if (el.dataset.min) {
    const t = tasks.find(x => x.id === el.dataset.min);
    if (!t) return;
    const v = el.value === "" ? null : Number(el.value);
    if (v !== null && (!Number.isFinite(v) || v < 0 || v > 1440)) {
      alert("请输入 0 至 1440 分钟。");
      el.value = t.actualMinutes ?? "";
      return;
    }
    t.actualMinutes = v;
    save();
    renderStats();
  }
});

$("list").addEventListener("click", e => {
  const btn = e.target.closest("[data-del]");
  if (!btn || !confirm("确定删除这项作业吗？")) return;
  tasks = tasks.filter(t => t.id !== btn.dataset.del);
  save();
  render();
});

$("dailyDate").addEventListener("change", () => {
  if (!$("dailyDate").value) $("dailyDate").value = today();
  render();
});
$("todayBtn").addEventListener("click", () => { $("dailyDate").value = today(); render(); });

$("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify({version:1, tasks, reflections}, null, 2)], {type:"application/json;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "每日作业计划备份-" + today() + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

$("importBtn").addEventListener("click", () => $("importFile").click());

$("importFile").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.tasks)) throw new Error("备份文件格式不正确");
      if (!confirm("恢复备份会替换当前浏览器中的作业数据，确定继续吗？")) { e.target.value = ""; return; }
      tasks = data.tasks.map(t => ({...t, id: t.id || (Date.now().toString(36) + Math.random().toString(36).slice(2,6))}));
      reflections = data.reflections || {};
      save();
      render();
      alert("备份恢复完成。");
    } catch (err) {
      alert("无法恢复：" + err.message);
    }
    e.target.value = "";
  };
  reader.readAsText(file);
});

render();
</script>
</body>
</html>
